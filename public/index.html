<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Siesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:      #D4552A;
      --orange-deep: #B8421A;
      --cream:       #FAF5EC;
      --dark:        #1A0D06;
      --muted:       #7A5C42;
    }

    html, body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      overflow-x: hidden;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(56px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes photoReveal {
      from { transform: scale(1.07); }
      to   { transform: scale(1); }
    }
    @keyframes ctaPop {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.6rem 2.8rem;
      transition: background 0.4s, backdrop-filter 0.4s;
    }
    nav.scrolled {
      background: rgba(26,13,6,0.88);
      backdrop-filter: blur(14px);
    }

    .nav-logo {
      display: inline-block;
      text-decoration: none;
      animation: fadeDown 0.7s 0.1s both cubic-bezier(0.22,1,0.36,1);
    }
    .nav-logo img {
      height: 52px;
      width: auto;
      display: block;
      border-radius: 8px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2rem;
      list-style: none;
      animation: fadeDown 0.7s 0.2s both cubic-bezier(0.22,1,0.36,1);
    }
    .nav-links a {
      color: rgba(250,245,236,0.72);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      font-weight: 400;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--cream); }
    .nav-links .pill {
      background: var(--orange);
      color: #fff !important;
      padding: 0.5rem 1.35rem;
      border-radius: 2rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.15s;
    }
    .nav-links .pill:hover { background: var(--orange-deep); transform: translateY(-1px); }

    /* ── HERO — full viewport, text inside ── */
    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 580px;
      overflow: hidden;
      background: var(--dark);
      display: flex;
      align-items: flex-end;
    }

    .hero-photo {
      position: absolute; inset: 0;
      background-image: url('/hero.jpg');
      background-size: cover;
      background-position: center 38%;
      filter: sepia(0.25) saturate(1.2) brightness(0.62) contrast(1.1);
      animation: photoReveal 9s ease-out forwards;
    }

    /* Gradient: dark at bottom so text is readable, lighter at top */
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(26,13,6,0.18) 0%,
        rgba(26,13,6,0.1)  40%,
        rgba(26,13,6,0.55) 75%,
        rgba(26,13,6,0.82) 100%
      );
    }

    /* ── HERO CONTENT ── */
    .hero-content {
      position: relative;
      z-index: 10;
      padding: 0 3rem 4.5rem;
      width: 100%;
    }

    .hero-tag {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(250,245,236,0.55);
      font-weight: 500;
      margin-bottom: 1.4rem;
      animation: revealUp 0.8s 0.4s both cubic-bezier(0.22,1,0.36,1);
    }

    .hero-h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.02em;
      margin-bottom: 1.8rem;
    }
    .hero-h1 .line1 {
      display: block;
      font-size: clamp(5rem, 14vw, 11rem);
      color: var(--cream);
      animation: revealUp 1s 0.55s both cubic-bezier(0.22,1,0.36,1);
    }
    .hero-h1 .line2 {
      display: block;
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-style: italic;
      font-weight: 700;
      color: var(--orange);
      animation: revealUp 1s 0.72s both cubic-bezier(0.22,1,0.36,1);
    }

    .hero-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
    }

    .hero-sub {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1rem, 2.5vw, 1.45rem);
      font-style: italic;
      color: rgba(250,245,236,0.62);
      font-weight: 400;
      max-width: 320px;
      line-height: 1.5;
      animation: revealUp 0.9s 0.9s both cubic-bezier(0.22,1,0.36,1);
    }

    .hero-cta {
      display: inline-block;
      background: var(--cream);
      color: var(--dark);
      padding: 1.1rem 3rem;
      border-radius: 3rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: ctaPop 0.9s 1.05s both cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 4px 28px rgba(0,0,0,0.3);
    }
    .hero-cta:hover {
      background: var(--orange);
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 8px 36px rgba(212,85,42,0.45);
    }

    /* ── SCROLL INDICATOR ── */
    .scroll-hint {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      animation: fadeIn 1s 1.6s both;
    }
    .scroll-hint span {
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(250,245,236,0.35);
    }
    .scroll-dot {
      width: 1px;
      height: 38px;
      background: linear-gradient(to bottom, rgba(250,245,236,0.45), transparent);
      animation: scrollDot 2s ease-in-out infinite;
    }
    @keyframes scrollDot {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      50.1%{ transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* ── BELOW FOLD ── */
    .about {
      background: var(--cream);
      padding: 5rem 3rem 6rem;
      max-width: 860px;
    }

    .about-tag {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--orange);
      font-weight: 600;
      margin-bottom: 1.4rem;
      display: block;
    }
    .about-body {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.8;
      max-width: 500px;
    }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      nav { padding: 1.1rem 1.4rem; }
      .nav-links { gap: 0.7rem; }
      .nav-links a { font-size: 0.72rem; }
      .hero-content { padding: 0 1.4rem 3.5rem; }
      .hero-bottom { flex-direction: column; align-items: flex-start; gap: 1.6rem; }
      .hero-cta { width: 100%; text-align: center; padding: 1.1rem; }
      .about { padding: 3.5rem 1.4rem 5rem; }
    }
  </style>
</head>
<body>

<nav id="nav">
  <a href="/" class="nav-logo"><img src="/logo.jpg" alt="La Siesta"></a>
  <ul class="nav-links">
    <li><a href="#about">The Garden</a></li>
    <li><a href="#about">Experience</a></li>
    <li><a href="/menu?table=1" class="pill">Order Now</a></li>
  </ul>
</nav>

<div class="hero">
  <div class="hero-photo"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <span class="hero-tag">Nagpur · Garden Café &amp; Coffee Bar</span>
    <h1 class="hero-h1">
      <span class="line1">La Siesta.</span>
      <span class="line2">slow down.</span>
    </h1>
    <div class="hero-bottom">
      <p class="hero-sub">come as you are,<br>stay as long as you like</p>
      <a href="/menu?table=1" class="hero-cta">Browse the Menu</a>
    </div>
  </div>

  <div class="scroll-hint">
    <span>Scroll</span>
    <div class="scroll-dot"></div>
  </div>
</div>

<section class="about" id="about">
  <span class="about-tag">A place to breathe</span>
  <p class="about-body">
    A garden terrace, a coffee bar &amp; an indoor lounge.<br>
    Where every cup is an excuse to linger a little longer.
  </p>
</section>

<script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  });
</script>

</body>
</html>

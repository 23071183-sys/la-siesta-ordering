<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Siesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:      #D4552A;
      --orange-deep: #B8421A;
      --cream:       #FAF5EC;
      --dark:        #1A0D06;
      --muted:       #7A5C42;
    }

    html, body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      overflow-x: hidden;
    }

    /* ── ENTRANCE ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(48px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes photoReveal {
      from { transform: scale(1.06); }
      to   { transform: scale(1); }
    }
    @keyframes ctaPop {
      from { opacity: 0; transform: translateY(32px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .anim { opacity: 0; animation-fill-mode: both; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 2.5rem;
      transition: background 0.4s, backdrop-filter 0.4s;
    }
    nav.scrolled {
      background: rgba(26,13,6,0.88);
      backdrop-filter: blur(12px);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: 0.05em;
      animation: fadeDown 0.7s 0.1s both cubic-bezier(0.22,1,0.36,1);
    }
    .nav-logo em { font-style: italic; color: var(--orange); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
      animation: fadeDown 0.7s 0.2s both cubic-bezier(0.22,1,0.36,1);
    }
    .nav-links a {
      color: rgba(250,245,236,0.75);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.07em;
      font-weight: 400;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--cream); }
    .nav-links .pill {
      background: var(--orange);
      color: #fff !important;
      padding: 0.48rem 1.25rem;
      border-radius: 2rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.15s;
    }
    .nav-links .pill:hover { background: var(--orange-deep); transform: translateY(-1px); }

    /* ── HERO PHOTO ── */
    .hero {
      width: 100%;
      height: 62vh;
      min-height: 380px;
      position: relative;
      overflow: hidden;
      background: var(--dark);
    }
    .hero-photo {
      position: absolute; inset: 0;
      background-image: url('/hero.jpg');
      background-size: cover;
      background-position: center 38%;
      filter: sepia(0.3) saturate(1.25) brightness(0.72) contrast(1.08);
      animation: photoReveal 8s ease-out forwards;
    }
    .hero-tint {
      position: absolute; inset: 0;
      background: rgba(180,60,10,0.16);
      mix-blend-mode: multiply;
    }
    .hero-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(26,13,6,0.4) 80%, rgba(26,13,6,0.65) 100%);
    }
    .hero-fog {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 220px;
      background: linear-gradient(to top, var(--cream) 0%, rgba(250,245,236,0.6) 30%, transparent 100%);
      z-index: 2;
    }

    /* ── INFO SECTION ── */
    .info {
      background: var(--cream);
      padding: 3rem 2.5rem 5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    /* line reveal wrapper — clips the text so it slides up from hidden */
    .reveal-wrap {
      overflow: hidden;
      display: block;
    }

    .info-tag {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--orange);
      font-weight: 600;
      margin-bottom: 1.2rem;
      animation: revealUp 0.8s 0.35s both cubic-bezier(0.22,1,0.36,1);
    }

    .info-h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      line-height: 0.92;
      color: var(--dark);
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }
    .info-h1 .line1 {
      display: block;
      font-size: clamp(5rem, 16vw, 11rem);
      animation: revealUp 0.9s 0.5s both cubic-bezier(0.22,1,0.36,1);
    }
    .info-h1 .line2 {
      display: block;
      font-size: clamp(3.5rem, 11vw, 8rem);
      font-style: italic;
      font-weight: 700;
      color: var(--orange);
      animation: revealUp 0.9s 0.65s both cubic-bezier(0.22,1,0.36,1);
    }

    .info-sub {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 2.6rem);
      font-weight: 400;
      font-style: italic;
      color: var(--dark);
      opacity: 0.7;
      margin-bottom: 1.6rem;
      animation: revealUp 0.9s 0.8s both cubic-bezier(0.22,1,0.36,1);
    }

    .info-divider {
      width: 60px;
      height: 2px;
      background: var(--orange);
      margin-bottom: 1.6rem;
      animation: revealUp 0.8s 0.95s both cubic-bezier(0.22,1,0.36,1);
    }

    .info-body {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      max-width: 480px;
      line-height: 1.75;
      margin-bottom: 2.8rem;
      animation: revealUp 0.9s 1.05s both cubic-bezier(0.22,1,0.36,1);
    }

    .info-cta {
      display: inline-block;
      background: var(--dark);
      color: var(--cream);
      padding: 1.1rem 3.5rem;
      border-radius: 3rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: ctaPop 0.9s 1.2s both cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 4px 24px rgba(26,13,6,0.18);
    }
    .info-cta:hover {
      background: var(--orange);
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(212,85,42,0.35);
    }

    /* ── SCROLL INDICATOR ── */
    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      animation: fadeDown 1s 1.5s both;
    }
    .scroll-hint span {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(250,245,236,0.45);
    }
    .scroll-dot {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, rgba(250,245,236,0.5), transparent);
      animation: scrollDot 1.8s ease-in-out infinite;
    }
    @keyframes scrollDot {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      50.1%{ transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      nav { padding: 1.1rem 1.25rem; }
      .nav-links { gap: 1rem; }
      .nav-links a:not(.pill) { display: none; }
      .hero { height: 55vh; }
      .info { padding: 2.5rem 1.25rem 4rem; }
      .info-cta { width: 100%; text-align: center; padding: 1.1rem; }
    }
  </style>
</head>
<body>

<nav id="nav">
  <a href="/" class="nav-logo"><em>La</em> SIESTA</a>
  <ul class="nav-links">
    <li><a href="#info">The Garden</a></li>
    <li><a href="#info">Experience</a></li>
    <li><a href="/menu?table=1" class="pill">Order Now</a></li>
  </ul>
</nav>

<div class="hero">
  <div class="hero-photo"></div>
  <div class="hero-tint"></div>
  <div class="hero-vignette"></div>
  <div class="hero-fog"></div>
  <div class="scroll-hint">
    <span>Scroll</span>
    <div class="scroll-dot"></div>
  </div>
</div>

<div class="info" id="info">
  <span class="info-tag">Nagpur · Garden Café &amp; Coffee Bar</span>
  <h1 class="info-h1">
    <span class="line1">La Siesta.</span>
    <span class="line2">slow down.</span>
  </h1>
  <p class="info-sub">come as you are, stay as long as you like</p>
  <div class="info-divider"></div>
  <p class="info-body">
    A garden terrace, a coffee bar &amp; an indoor lounge.<br>
    Where every cup is an excuse to linger a little longer.
  </p>
  <a href="/menu?table=1" class="info-cta">Browse the Menu</a>
</div>

<script>
  // Nav background on scroll
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  });
</script>

</body>
</html>

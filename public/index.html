<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Siesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #D4552A;
      --orange-deep: #B8421A;
      --cream: #FAF5EC;
      --dark: #1A0D06;
      --text-muted: #7A5C42;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.6rem 3.5rem;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: 0.04em;
      opacity: 0.92;
    }
    .nav-logo em { font-style: italic; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2rem;
      list-style: none;
    }
    .nav-links a {
      color: rgba(250,245,236,0.78);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      font-weight: 400;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--cream); }
    .nav-links .pill {
      background: var(--orange);
      color: var(--cream) !important;
      padding: 0.5rem 1.3rem;
      border-radius: 2rem;
      font-weight: 500;
      transition: background 0.2s !important;
    }
    .nav-links .pill:hover { background: var(--orange-deep) !important; }

    /* ── HERO ── */
    .hero {
      width: 100%;
      height: 100vh;
      min-height: 520px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dark); /* fallback while photo loads */
    }

    /* ── PHOTO LAYER — warm treatment ── */
    .hero-photo {
      position: absolute;
      inset: 0;
      background-image: url('/hero.jpg');
      background-size: cover;
      background-position: center 38%;
      /* sepia warmth + slight darken to match brand palette */
      filter: sepia(0.35) saturate(1.3) brightness(0.68) contrast(1.08);
      transform: scale(1.04); /* slight zoom so edges don't show */
      transition: transform 8s ease-out;
    }
    .hero-photo.loaded { transform: scale(1); }

    /* ── COLOUR OVERLAYS ── */
    /* warm orange tint across the whole photo */
    .hero-tint {
      position: absolute;
      inset: 0;
      background: rgba(180, 60, 10, 0.18);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 1;
    }

    /* vignette — darker edges, brighter centre */
    .hero-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at 50% 55%,
        transparent 30%,
        rgba(26,13,6,0.45) 80%,
        rgba(26,13,6,0.72) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* cream fade-out at the bottom — blends into info section */
    .hero-fog {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 200px;
      background: linear-gradient(to top,
        #FAF5EC 0%,
        rgba(250,245,236,0.7) 20%,
        rgba(250,245,236,0.0) 100%
      );
      pointer-events: none;
      z-index: 3;
    }

    /* the glowing logo sign */
    .hero-sign {
      position: relative;
      z-index: 5;
      animation: sign-pulse 4s ease-in-out infinite;
    }
    @keyframes sign-pulse {
      0%,100% { filter: drop-shadow(0 0 22px rgba(212,85,42,0.6)) drop-shadow(0 0 60px rgba(212,85,42,0.25)); }
      50%      { filter: drop-shadow(0 0 40px rgba(212,85,42,0.9)) drop-shadow(0 0 100px rgba(212,85,42,0.4)); }
    }

    /* rising steam */
    .steam-wrap {
      position: absolute;
      bottom: 160px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 14px;
      z-index: 4;
    }
    .steam-line {
      width: 3px; height: 55px;
      background: linear-gradient(to top, rgba(250,245,236,0.25), transparent);
      border-radius: 4px;
      animation: steam 3s ease-in-out infinite;
    }
    .steam-line:nth-child(2) { animation-delay: 1s; height: 40px; }
    .steam-line:nth-child(3) { animation-delay: 2s; }
    @keyframes steam {
      0%   { transform: translateY(0) scaleX(1); opacity: 0.8; }
      100% { transform: translateY(-80px) scaleX(2.5); opacity: 0; }
    }

    /* ── INFO SECTION ── */
    .info {
      background: var(--cream);
      padding: 3.2rem 1.5rem 4rem;
      text-align: center;
    }

    .info-sub {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--orange);
      font-weight: 500;
      margin-bottom: 0.8rem;
    }

    .info-h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 900;
      line-height: 0.95;
      color: var(--dark);
      letter-spacing: -0.01em;
    }

    .info-h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 4rem);
      font-weight: 700;
      font-style: italic;
      color: var(--dark);
      line-height: 1.2;
      margin-top: 0.2rem;
      margin-bottom: 1.4rem;
    }

    .info-body {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 300;
      max-width: 460px;
      margin: 0 auto 2.2rem;
      line-height: 1.7;
    }

    .info-cta {
      display: inline-block;
      background: var(--dark);
      color: var(--cream);
      padding: 1rem 3.2rem;
      border-radius: 3rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .info-cta:hover { background: var(--orange); transform: translateY(-2px); }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      nav { padding: 1.2rem 1.4rem; }
      .nav-links { gap: 1.2rem; }
      .nav-links a { font-size: 0.75rem; }
      .hero { height: 58vh; }
      .hero-sign svg { width: 240px !important; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="#" class="nav-logo"><em>La</em> SIESTA</a>
  <ul class="nav-links">
    <li><a href="#info">The Experience</a></li>
    <li><a href="#info">La Siesta Garden</a></li>
    <li><a href="/menu?table=1" class="pill">Order Now</a></li>
  </ul>
</nav>

<!-- HERO -->
<div class="hero">
  <!-- Photo background with warm CSS treatment -->
  <div class="hero-photo" id="heroPhoto"></div>
  <div class="hero-tint"></div>
  <div class="hero-vignette"></div>

  <!-- Glowing oval sign -->
  <div class="hero-sign">
    <svg viewBox="0 0 330 308" width="330" xmlns="http://www.w3.org/2000/svg" fill="none">
      <!-- outer oval glow ring -->
      <ellipse cx="165" cy="154" rx="155" ry="147" stroke="rgba(212,85,42,0.18)" stroke-width="6"/>
      <!-- main oval -->
      <ellipse cx="165" cy="154" rx="150" ry="142" fill="rgba(250,245,236,0.04)" stroke="#D4552A" stroke-width="3"/>

      <!-- Saucer -->
      <ellipse cx="165" cy="229" rx="74" ry="11" stroke="#D4552A" stroke-width="2.2" fill="none"/>

      <!-- Cup body -->
      <path d="M 100 178 C 104 171 226 171 230 178 L 222 213 C 217 228 114 228 109 213 Z"
            stroke="#D4552A" stroke-width="2.5" fill="rgba(250,245,236,0.04)"/>
      <!-- Cup handle -->
      <path d="M 230 182 C 250 182 252 189 252 196 C 252 203 250 210 230 210"
            stroke="#D4552A" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Cup rim scallop -->
      <path d="M 101 178 Q 113 166 125 178 Q 137 166 149 178 Q 161 166 173 178 Q 185 166 197 178 Q 209 166 221 178"
            stroke="#D4552A" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Woman body (reclining) -->
      <path d="M 114 170 C 128 154 154 161 176 156 C 194 152 208 155 218 150"
            stroke="#D4552A" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Legs hint -->
      <path d="M 112 169 C 106 175 107 183 114 180"
            stroke="#D4552A" stroke-width="2" stroke-linecap="round"/>
      <!-- Head -->
      <ellipse cx="224" cy="140" rx="12" ry="13" stroke="#D4552A" stroke-width="2" fill="rgba(250,245,236,0.04)"/>
      <!-- Hair -->
      <path d="M 229 130 C 241 121 257 124 259 136 C 257 148 243 150 231 148"
            stroke="#D4552A" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Raised arm -->
      <path d="M 213 148 C 206 130 197 113 187 99"
            stroke="#D4552A" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Mini cup -->
      <path d="M 180 85 L 196 85 L 194 100 L 181 100 Z"
            stroke="#D4552A" stroke-width="2" fill="rgba(250,245,236,0.04)" stroke-linejoin="round"/>
      <path d="M 196 89 C 205 89 205 96 196 96"
            stroke="#D4552A" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Steam wisps from mini cup -->
      <path d="M 183 85 C 181 75 184 66 181 57" stroke="#D4552A" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 189 85 C 187 74 190 64 187 55" stroke="#D4552A" stroke-width="1.6" stroke-linecap="round"/>

      <!-- "La" -->
      <text x="84" y="192" font-family="Georgia,'Times New Roman',serif"
            font-style="italic" font-size="36" fill="#D4552A">La</text>
      <!-- "SIESTA" -->
      <text x="50" y="272" font-family="Georgia,'Times New Roman',serif"
            font-size="52" font-weight="700" letter-spacing="5" fill="#D4552A">SIESTA</text>
    </svg>
  </div>

  <!-- Steam wisps rising above sign -->
  <div class="steam-wrap">
    <div class="steam-line"></div>
    <div class="steam-line"></div>
    <div class="steam-line"></div>
  </div>

  <div class="hero-fog"></div>
</div>

<!-- INFO SECTION -->
<div class="info">
  <span class="info-sub">La Siesta Garden</span>
  <h1 class="info-h1">We're Open!</h1>
  <p class="info-h2">come slow down with us</p>
  <p class="info-body">
    Join us in our garden terrace, coffee bar &amp; indoor lounge.<br>
    A café where time moves at your own pace.
  </p>
  <a href="/menu?table=1" class="info-cta">Order Now</a>
</div>

<script>
  // Trigger Ken Burns zoom-out once photo is loaded
  const photo = document.getElementById('heroPhoto');
  const img = new Image();
  img.src = '/hero.jpg';
  img.onload = () => photo.classList.add('loaded');
  // Fallback: start animation after 300ms regardless
  setTimeout(() => photo.classList.add('loaded'), 300);
</script>

</body>
</html>

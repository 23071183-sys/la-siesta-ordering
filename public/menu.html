<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Siesta — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:   #3d9142;
      --red:     #e43b4f;
      --orange:  #C4501F;
      --orange-l:#E8703A;
      --brown:   #5C3D2E;
      --dark:    #2B1810;
      --gray:    #7A5C42;
      --cream:   #FAF5EC;
      --cream2:  #F2E8D9;
      --light:   #F5EDE0;
      --border:  #E2D5C3;
      --white:   #FFFDF9;
      --sidebar: #F7EFE3;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ── RESTAURANT HEADER ── */
    .rest-header {
      background: var(--white);
      padding: 1rem 1rem 0;
      border-bottom: 8px solid var(--cream2);
    }
    .rest-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .rest-logo {
      width: 56px; height: 56px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .rest-logo img { width: 100%; height: 100%; object-fit: cover; }
    .rest-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--dark);
      flex: 1;
      margin-left: 0.75rem;
      line-height: 1.2;
    }
    .table-badge {
      background: #fff3f3;
      color: var(--orange);
      border: 1px solid #ffd5c8;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }
    .rest-meta {
      display: flex;
      gap: 1.2rem;
      padding-bottom: 0.9rem;
      font-size: 0.8rem;
      color: var(--gray);
    }
    .rest-meta span { display: flex; align-items: center; gap: 0.3rem; }
    .rating-badge {
      background: var(--green);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.18rem 0.45rem;
      border-radius: 4px;
      display: inline-flex; align-items: center; gap: 0.2rem;
    }

    /* ── SEARCH ── */
    .search-wrap {
      background: var(--white);
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--light);
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      gap: 0.55rem;
    }
    .search-box svg { flex-shrink: 0; color: var(--gray); }
    .search-box input {
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--dark);
      width: 100%;
      outline: none;
    }
    .search-box input::placeholder { color: #aaa; }

    /* ── VEG FILTER ── */
    .filter-bar {
      background: var(--white);
      padding: 0.55rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .veg-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.38rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--gray);
      background: var(--white);
      white-space: nowrap;
      transition: all 0.15s;
      user-select: none;
    }
    .veg-toggle.active {
      border-color: var(--green);
      color: var(--green);
      background: #f0fff0;
    }
    .veg-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ── LAYOUT: sidebar + content ── */
    .menu-layout {
      display: flex;
    }

    /* ── CATEGORY SIDEBAR ── */
    .cat-sidebar {
      width: 105px;
      flex-shrink: 0;
      position: sticky;
      top: 49px;
      height: calc(100vh - 49px);
      overflow-y: auto;
      scrollbar-width: none;
      background: var(--light);
      border-right: 1px solid var(--border);
    }
    .cat-sidebar::-webkit-scrollbar { display: none; }
    .sidebar-btn {
      display: block;
      width: 100%;
      padding: 0.85rem 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--gray);
      background: transparent;
      border: none;
      border-left: 3px solid transparent;
      text-align: left;
      cursor: pointer;
      line-height: 1.3;
      transition: all 0.15s;
    }
    .sidebar-btn.active {
      background: var(--white);
      color: var(--orange);
      font-weight: 700;
      border-left-color: var(--orange);
    }

    /* ── MENU ITEMS ── */
    .menu-content { flex: 1; min-width: 0; }

    .cat-section { border-bottom: 8px solid var(--light); }

    .cat-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--dark);
      padding: 1.2rem 1rem 0.2rem;
    }
    .cat-subtitle {
      font-size: 0.78rem;
      color: var(--gray);
      padding: 0 1rem 0.8rem;
    }

    /* ── ITEM ROW ── */
    .item-row {
      display: flex;
      align-items: flex-start;
      padding: 1rem 1rem;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
      position: relative;
    }
    .item-row:last-child { border-bottom: none; }

    .item-left { flex: 1; min-width: 0; }

    /* Veg/Non-veg indicator */
    .veg-icon {
      width: 16px; height: 16px;
      border-radius: 2px;
      border: 1.5px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.35rem;
      flex-shrink: 0;
    }
    .veg-icon .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .veg-icon.nonveg { border-color: var(--red); }
    .veg-icon.nonveg .dot { background: var(--red); }

    .item-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--dark);
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }
    .item-price {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.35rem;
    }
    .item-desc {
      font-size: 0.75rem;
      color: var(--gray);
      font-weight: 400;
      line-height: 1.5;
    }

    /* ── ADD BUTTON ── */
    .item-right {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0.2rem;
    }

    .add-btn {
      border: 1.5px solid var(--orange);
      background: var(--white);
      color: var(--orange);
      border-radius: 8px;
      width: 72px;
      height: 34px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.2rem;
      transition: background 0.12s;
    }
    .add-btn:active { background: var(--light); }

    .qty-ctrl {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--orange);
      border-radius: 8px;
      overflow: hidden;
      width: 72px;
      height: 34px;
    }
    .qty-btn {
      flex: 1;
      border: none;
      background: var(--white);
      color: var(--orange);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      height: 100%;
      transition: background 0.1s;
    }
    .qty-btn:active { background: var(--light); }
    .qty-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--orange);
      min-width: 18px;
      text-align: center;
    }
    .customizable {
      font-size: 0.6rem;
      color: var(--gray);
      margin-top: 0.3rem;
      text-align: center;
    }

    /* ── CART BAR ── */
    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--dark);
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      transform: translateY(110%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
    }
    .cart-bar.visible { transform: translateY(0); }
    .cart-bar-left { color: #fff; }
    .cart-item-count { font-size: 0.78rem; font-weight: 500; opacity: 0.88; }
    .cart-amount { font-size: 1rem; font-weight: 700; }
    .checkout-btn {
      background: var(--orange);
      color: var(--white);
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .checkout-btn:active { opacity: 0.85; }

    /* ── ORDER MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--white);
      border-radius: 16px 16px 0 0;
      padding: 0 1.25rem 2.5rem;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
    }
    .modal-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0.9rem auto 1.2rem;
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 1rem;
    }
    .order-summary {
      background: var(--light);
      border-radius: 10px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 1.2rem;
    }
    .sum-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      font-size: 0.88rem;
      color: var(--dark);
      border-bottom: 1px solid var(--border);
    }
    .sum-row:last-child { border-bottom: none; }
    .sum-row.total-row {
      font-weight: 700;
      font-size: 0.96rem;
      padding-top: 0.6rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 0.4rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      background: var(--white);
      color: var(--dark);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--orange); }
    .place-btn {
      width: 100%;
      padding: 1rem;
      background: var(--dark);
      color: var(--cream);
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .place-btn:active { opacity: 0.88; }
    .place-btn:disabled { background: #bbb; cursor: not-allowed; }

    /* Phone / OTP */
    .phone-row { display: flex; align-items: center; gap: 0.5rem; }
    .phone-prefix {
      flex-shrink: 0;
      padding: 0.75rem 0.7rem;
      background: var(--light);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--gray);
    }
    .phone-input { flex: 1; }
    .otp-send-btn {
      flex-shrink: 0;
      padding: 0.75rem 0.9rem;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .otp-send-btn:disabled { background: #bbb; cursor: not-allowed; }
    .otp-row { display: flex; gap: 0.5rem; }
    .otp-input { flex: 1; letter-spacing: 0.2em; font-size: 1rem; font-weight: 600; }
    .otp-verify-btn {
      flex-shrink: 0;
      padding: 0.75rem 0.9rem;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .otp-verify-btn:disabled { background: #bbb; cursor: not-allowed; }
    .otp-timer { font-size: 0.7rem; color: var(--orange); font-weight: 600; margin-left: 0.3rem; }
    .field-error { font-size: 0.75rem; color: #e43b4f; margin-top: 0.3rem; min-height: 1rem; }
    .resend-link {
      background: none; border: none;
      color: var(--orange); font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem; font-weight: 500;
      cursor: pointer; padding: 0; margin-top: 0.4rem;
      text-decoration: underline;
    }
    .verified-badge {
      display: flex; align-items: center; gap: 0.4rem;
      background: #fdf3ee; border: 1.5px solid var(--orange);
      color: var(--orange); font-size: 0.82rem; font-weight: 600;
      padding: 0.5rem 0.9rem; border-radius: 8px; margin-bottom: 1rem;
    }

    /* ── SUCCESS ── */
    .success-screen {
      display: none;
      position: fixed; inset: 0;
      background: var(--white);
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .success-screen.show { display: flex; }
    .success-icon {
      width: 72px; height: 72px;
      background: var(--orange);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.4rem;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-screen h2 { font-size: 1.8rem; font-weight: 700; color: var(--dark); margin-bottom: 0.4rem; }
    .success-screen p { color: var(--gray); font-size: 0.9rem; line-height: 1.65; }
    .order-num {
      background: var(--light);
      color: var(--dark);
      padding: 0.5rem 2rem;
      border-radius: 8px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin: 1rem 0 1.4rem;
    }
    .new-order-btn {
      margin-top: 0.75rem;
      padding: 0.75rem 2rem;
      background: var(--orange);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── EMPTY SEARCH STATE ── */
    .empty-search {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--gray);
      font-size: 0.9rem;
      display: none;
    }

    .sidebar-top-btn {
      display: block;
      width: 100%;
      padding: 0.9rem 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--orange);
      background: var(--white);
      border: none;
      border-left: 3px solid transparent;
      border-top: 1px solid var(--border);
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .sidebar-top-btn:active { background: var(--light); }

    @media (min-width: 600px) {
      .cat-sidebar { width: 130px; }
    }
  </style>
</head>
<body>

<!-- RESTAURANT HEADER -->
<div class="rest-header">
  <div class="rest-top">
    <div class="rest-logo"><img src="/logo.jpg" alt="La Siesta"></div>
    <div class="rest-name">La Siesta</div>
    <div class="table-badge" id="tableBadge">Table —</div>
  </div>
  <div class="rest-meta">
    <span>Garden Café · Nagpur</span>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search in menu" oninput="filterMenu()">
  </div>
</div>

<!-- VEG FILTER -->
<div class="filter-bar">
  <div class="veg-toggle" id="vegToggle" onclick="toggleVeg()">
    <div class="veg-dot"></div>
    Veg Only
  </div>
  <div class="veg-toggle" id="nonvegToggle" onclick="toggleNonVeg()" style="--dot-color:#e43b4f">
    <div class="veg-dot" style="background:var(--red)"></div>
    Non Veg
  </div>
</div>

<!-- LAYOUT -->
<div class="menu-layout">

  <!-- CATEGORY SIDEBAR -->
  <nav class="cat-sidebar" id="catSidebar"></nav>

  <!-- MENU CONTENT -->
  <div class="menu-content" id="menuContent">
    <div class="empty-search" id="emptySearch">No items found</div>
  </div>

</div>

<!-- CART BAR -->
<div class="cart-bar" id="cartBar">
  <div class="cart-bar-left">
    <div class="cart-item-count" id="cartCountLbl">0 items</div>
    <div class="cart-amount" id="cartTotalLbl">₹0</div>
  </div>
  <button class="checkout-btn" onclick="openCheckout()">View Cart →</button>
</div>

<!-- ORDER MODAL -->
<div class="modal-backdrop" id="orderModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Your Order</div>
    <div class="order-summary" id="orderSummary"></div>

    <div class="form-group">
      <label class="form-label">Your Name</label>
      <input class="form-input" id="custName" type="text" placeholder="Name to call out">
    </div>

    <div class="form-group">
      <label class="form-label">Mobile Number</label>
      <div class="phone-row">
        <div class="phone-prefix">+91</div>
        <input class="form-input phone-input" id="custPhone" type="tel" maxlength="10" placeholder="10-digit number" oninput="onPhoneInput()">
        <button class="otp-send-btn" id="otpSendBtn" onclick="sendOTP()" disabled>Send OTP</button>
      </div>
      <div id="phoneError" class="field-error"></div>
    </div>

    <div class="form-group" id="otpGroup" style="display:none">
      <label class="form-label">Enter OTP <span id="otpTimer" class="otp-timer"></span></label>
      <div class="otp-row">
        <input class="form-input otp-input" id="otpInput" type="tel" maxlength="6" placeholder="6-digit OTP" oninput="onOtpInput()">
        <button class="otp-verify-btn" id="otpVerifyBtn" onclick="verifyOTP()" disabled>Verify</button>
      </div>
      <div id="otpError" class="field-error"></div>
      <button class="resend-link" id="resendBtn" onclick="sendOTP(true)" style="display:none">Resend OTP</button>
    </div>

    <div class="verified-badge" id="verifiedBadge" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Phone verified
    </div>

    <div class="form-group">
      <label class="form-label">Special Requests</label>
      <input class="form-input" id="orderNotes" type="text" placeholder="No sugar, extra ice, oat milk…">
    </div>
    <button class="place-btn" id="placeBtn" onclick="placeOrder()" disabled>Verify phone to place order</button>
  </div>
</div>

<!-- SUCCESS -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h2>Order Placed!</h2>
  <div class="order-num" id="successNum">#0001</div>
  <p>Your order is at the counter.<br>Sit back &amp; relax — we'll bring it to you ☕</p>
  <button class="new-order-btn" onclick="resetOrder()">Order More</button>
</div>

<script>
  let menu = [];
  let cart = {};
  let tableNumber = 1;
  let vegOnly = false;
  let nonVegOnly = false;

  const NON_VEG_KEYWORDS = ['chicken', 'egg', 'mutton', 'prawn', 'fish', 'beef', 'pork', 'keema', 'bonafide'];

  const DESSERT_IMAGES = {
    'Mango Tres Leches':     '/ds1.png',
    'Mango Misu':            '/ds2.png',
    'Tiramisu':              '/ds3.png',
    'Chocolate Croissant':   '/ds4.png',
    'Belgian Chocolate Cake':'/ds5.png',
  };

  function isNonVeg(name, desc = '') {
    const text = (name + ' ' + desc).toLowerCase();
    return NON_VEG_KEYWORDS.some(k => text.includes(k));
  }

  const params = new URLSearchParams(window.location.search);
  tableNumber = parseInt(params.get('table')) || 1;
  document.getElementById('tableBadge').textContent = `Table ${tableNumber}`;

  fetch('/api/menu').then(r => r.json()).then(data => {
    menu = data;
    renderSidebar();
    renderMenu();
    setupScrollSpy();
  });

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('catSidebar').scrollTo({ top: 0, behavior: 'smooth' });
    const firstBtn = document.querySelector('.sidebar-btn');
    if (firstBtn) {
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      firstBtn.classList.add('active');
    }
  }

  function renderSidebar() {
    document.getElementById('catSidebar').innerHTML = menu.map((cat, i) =>
      `<button class="sidebar-btn${i===0?' active':''}" id="side-${cat.id}" data-cat="${cat.id}" onclick="scrollToCat(${cat.id},this)">${cat.name}</button>`
    ).join('') + `<button class="sidebar-top-btn" onclick="scrollToTop()" title="Back to top">↑</button>`;
  }

  function toggleVeg() {
    vegOnly = !vegOnly;
    if (vegOnly) nonVegOnly = false;
    document.getElementById('vegToggle').classList.toggle('active', vegOnly);
    document.getElementById('nonvegToggle').classList.toggle('active', nonVegOnly);
    renderMenu();
  }

  function toggleNonVeg() {
    nonVegOnly = !nonVegOnly;
    if (nonVegOnly) vegOnly = false;
    document.getElementById('nonvegToggle').classList.toggle('active', nonVegOnly);
    document.getElementById('vegToggle').classList.toggle('active', vegOnly);
    renderMenu();
  }

  function filterMenu() {
    renderMenu();
  }

  function renderMenu() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    let html = '';
    let anyVisible = false;

    for (const cat of menu) {
      // hide drink categories when veg/non-veg filter is active
      if ((vegOnly || nonVegOnly) && !FOOD_CATS.includes(cat.name)) continue;

      const items = cat.items.filter(item => {
        if (vegOnly && isNonVeg(item.name, item.description)) return false;
        if (nonVegOnly && !isNonVeg(item.name, item.description)) return false;
        if (query && !item.name.toLowerCase().includes(query) && !(item.description||'').toLowerCase().includes(query)) return false;
        return true;
      });
      if (items.length === 0) continue;
      anyVisible = true;
      html += `
        <div class="cat-section" id="cat-${cat.id}" data-cat="${cat.id}">
          <div class="cat-title">${cat.name}</div>
          <div class="cat-subtitle">${items.length} item${items.length!==1?'s':''}</div>
          ${items.map(item => renderItemRow(item, cat.name)).join('')}
        </div>`;
    }

    document.getElementById('menuContent').innerHTML = html + `<div class="empty-search" id="emptySearch" style="display:${anyVisible?'none':'block'}">No items found</div>`;
    if (query || vegOnly) return; // don't re-setup scroll spy on filter
    setupScrollSpy();
  }

  const FOOD_CATS = ['Food', 'Rice Bowls', 'Sweets', 'Desserts'];

  function renderItemRow(item, catName = '') {
    const qty = cart[item.id]?.qty || 0;
    const nv = isNonVeg(item.name, item.description);
    const vegHtml = FOOD_CATS.includes(catName)
      ? `<div class="veg-icon${nv?' nonveg':''}"><div class="dot"></div></div>`
      : '';
    const ctrl = qty === 0
      ? `<button class="add-btn" onclick="addItem(${item.id})"><span>+</span> ADD</button>`
      : `<div class="qty-ctrl">
           <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
           <span class="qty-num">${qty}</span>
           <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
         </div>`;
    const dsImg = DESSERT_IMAGES[item.name]
      ? `<img src="${DESSERT_IMAGES[item.name]}" alt="${item.name}" style="width:100%;border-radius:10px;margin:0.6rem 0 0.2rem;object-fit:cover;max-height:160px;display:block;">`
      : '';
    return `
      <div class="item-row" id="card-${item.id}">
        <div class="item-left">
          ${vegHtml}
          <div class="item-name">${item.name}</div>
          <div class="item-price">₹${item.price}</div>
          ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
          ${dsImg}
        </div>
        <div class="item-right" id="ctrl-${item.id}">${ctrl}</div>
      </div>`;
  }

  function getItemById(id) {
    for (const cat of menu) {
      const item = cat.items.find(i => i.id === id);
      if (item) return item;
    }
  }

  function addItem(id) {
    const item = getItemById(id);
    cart[id] = { id, name: item.name, price: item.price, qty: (cart[id]?.qty || 0) + 1 };
    refreshCtrl(id);
    updateCartBar();
  }

  function changeQty(id, delta) {
    const qty = (cart[id]?.qty || 0) + delta;
    if (qty <= 0) { delete cart[id]; }
    else {
      const item = getItemById(id);
      cart[id] = { id, name: item.name, price: item.price, qty };
    }
    refreshCtrl(id);
    updateCartBar();
  }

  function refreshCtrl(id) {
    const qty = cart[id]?.qty || 0;
    const el = document.getElementById(`ctrl-${id}`);
    if (!el) return;
    el.innerHTML = qty === 0
      ? `<button class="add-btn" onclick="addItem(${id})"><span>+</span> ADD</button>`
      : `<div class="qty-ctrl">
           <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
           <span class="qty-num">${qty}</span>
           <button class="qty-btn" onclick="changeQty(${id},1)">+</button>
         </div>`;
  }

  function updateCartBar() {
    const items = Object.values(cart);
    const count = items.reduce((s,i) => s + i.qty, 0);
    const total = items.reduce((s,i) => s + i.price * i.qty, 0);
    document.getElementById('cartCountLbl').textContent = `${count} item${count!==1?'s':''}`;
    document.getElementById('cartTotalLbl').textContent = `₹${total}`;
    document.getElementById('cartBar').classList.toggle('visible', count > 0);
  }

  function scrollToCat(id, btn) {
    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const el = document.getElementById(`cat-${id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function setupScrollSpy() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const id = e.target.dataset.cat;
          document.querySelectorAll('.sidebar-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.cat === id);
          });
          document.getElementById(`side-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }, { rootMargin: '-100px 0px -55% 0px', threshold: 0 });

    setTimeout(() => {
      document.querySelectorAll('.cat-section').forEach(s => obs.observe(s));
    }, 400);
  }

  // ── OTP FLOW ──
  let phoneVerified = false;
  let otpTimerInterval = null;

  function onPhoneInput() {
    const phone = document.getElementById('custPhone').value;
    document.getElementById('phoneError').textContent = '';
    if (phoneVerified) {
      phoneVerified = false;
      document.getElementById('verifiedBadge').style.display = 'none';
      document.getElementById('otpGroup').style.display = 'none';
      document.getElementById('placeBtn').disabled = true;
      document.getElementById('placeBtn').textContent = 'Verify phone to place order';
    }
    document.getElementById('otpSendBtn').disabled = !/^[6-9]\d{9}$/.test(phone);
  }

  async function sendOTP(isResend = false) {
    const phone = document.getElementById('custPhone').value.trim();
    if (!/^[6-9]\d{9}$/.test(phone)) {
      document.getElementById('phoneError').textContent = 'Enter a valid 10-digit mobile number';
      return;
    }
    const btn = document.getElementById('otpSendBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    document.getElementById('phoneError').textContent = '';
    document.getElementById('otpError').textContent = '';
    try {
      const res = await fetch('/api/otp/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('otpGroup').style.display = 'block';
        document.getElementById('otpInput').value = '';
        document.getElementById('resendBtn').style.display = 'none';
        startOtpTimer();
      } else {
        document.getElementById('phoneError').textContent = data.error || 'Failed to send OTP';
        btn.disabled = false;
      }
    } catch {
      document.getElementById('phoneError').textContent = 'Network error. Try again.';
      btn.disabled = false;
    }
    btn.textContent = isResend ? 'Resend OTP' : 'Send OTP';
  }

  function startOtpTimer() {
    clearInterval(otpTimerInterval);
    let seconds = 60;
    const timerEl = document.getElementById('otpTimer');
    timerEl.textContent = `(${seconds}s)`;
    otpTimerInterval = setInterval(() => {
      seconds--;
      timerEl.textContent = seconds > 0 ? `(${seconds}s)` : '';
      if (seconds <= 0) {
        clearInterval(otpTimerInterval);
        document.getElementById('resendBtn').style.display = 'inline';
      }
    }, 1000);
  }

  function onOtpInput() {
    document.getElementById('otpError').textContent = '';
    document.getElementById('otpVerifyBtn').disabled = document.getElementById('otpInput').value.length !== 6;
  }

  async function verifyOTP() {
    const phone = document.getElementById('custPhone').value.trim();
    const otp   = document.getElementById('otpInput').value.trim();
    const btn   = document.getElementById('otpVerifyBtn');
    btn.disabled = true; btn.textContent = 'Verifying…';
    document.getElementById('otpError').textContent = '';
    try {
      const res = await fetch('/api/otp/verify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, otp })
      });
      const data = await res.json();
      if (data.success) {
        phoneVerified = true;
        clearInterval(otpTimerInterval);
        document.getElementById('otpGroup').style.display = 'none';
        document.getElementById('verifiedBadge').style.display = 'flex';
        document.getElementById('placeBtn').disabled = false;
        document.getElementById('placeBtn').textContent = 'Place Order';
        document.getElementById('custPhone').disabled = true;
        document.getElementById('otpSendBtn').style.display = 'none';
      } else {
        document.getElementById('otpError').textContent = data.error || 'Incorrect OTP';
        btn.disabled = false; btn.textContent = 'Verify';
      }
    } catch {
      document.getElementById('otpError').textContent = 'Network error. Try again.';
      btn.disabled = false; btn.textContent = 'Verify';
    }
  }

  function openCheckout() {
    const items = Object.values(cart);
    const total = items.reduce((s,i) => s + i.price * i.qty, 0);
    document.getElementById('orderSummary').innerHTML =
      items.map(i => `
        <div class="sum-row">
          <span>${i.qty}× ${i.name}</span>
          <span>₹${i.price * i.qty}</span>
        </div>`).join('') +
      `<div class="sum-row total-row"><span>Total</span><span>₹${total}</span></div>`;
    document.getElementById('orderModal').classList.add('open');
  }

  document.getElementById('orderModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  async function placeOrder() {
    const btn = document.getElementById('placeBtn');
    btn.disabled = true; btn.textContent = 'Placing…';
    try {
      const res = await fetch('/api/orders', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          table_number: tableNumber,
          customer_name: document.getElementById('custName').value.trim(),
          customer_phone: document.getElementById('custPhone').value.trim(),
          notes: document.getElementById('orderNotes').value.trim(),
          items: Object.values(cart).map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.qty }))
        })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('orderModal').classList.remove('open');
        document.getElementById('successNum').textContent = `#${String(data.order_id).padStart(4,'0')}`;
        document.getElementById('successScreen').classList.add('show');
        cart = {};
        updateCartBar();
      } else {
        alert('Something went wrong. Please try again.');
        btn.disabled = false; btn.textContent = 'Place Order';
      }
    } catch {
      alert('Connection error. Please try again.');
      btn.disabled = false; btn.textContent = 'Place Order';
    }
  }

  function resetOrder() {
    document.getElementById('successScreen').classList.remove('show');
    document.getElementById('custName').value = '';
    document.getElementById('orderNotes').value = '';
    phoneVerified = false;
    clearInterval(otpTimerInterval);
    document.getElementById('custPhone').value = '';
    document.getElementById('custPhone').disabled = false;
    document.getElementById('otpSendBtn').style.display = '';
    document.getElementById('otpSendBtn').disabled = true;
    document.getElementById('otpSendBtn').textContent = 'Send OTP';
    document.getElementById('otpGroup').style.display = 'none';
    document.getElementById('otpInput').value = '';
    document.getElementById('verifiedBadge').style.display = 'none';
    document.getElementById('phoneError').textContent = '';
    document.getElementById('otpError').textContent = '';
    document.getElementById('placeBtn').disabled = true;
    document.getElementById('placeBtn').textContent = 'Verify phone to place order';
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Siesta — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:     #3d9142;
      --red:       #e43b4f;
      --orange:    #C4501F;
      --orange-l:  #E8703A;
      --brown:     #5C3D2E;
      --dark:      #2B1810;
      --gray:      #8A6A52;
      --cream:     #FAF5EC;
      --cream2:    #F0E6D3;
      --light:     #F5EDE0;
      --border:    #E4D4BF;
      --white:     #FFFDF9;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream2);
      color: var(--dark);
      min-height: 100vh;
      padding-bottom: 150px; /* cart bar (90px) + bottom nav (56px) */
    }

    /* ── RESTAURANT HEADER ── */
    .rest-header {
      background: var(--dark);
      padding: 1.1rem 1rem 1rem;
      position: relative;
      overflow: hidden;
    }
    .rest-header::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 120% 50%, rgba(196,80,31,0.30) 0%, transparent 58%);
      pointer-events: none;
    }
    .rest-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .rest-logo {
      width: 46px; height: 46px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1.5px solid rgba(255,255,255,0.16);
    }
    .rest-logo img { width: 100%; height: 100%; object-fit: cover; }
    .rest-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
      color: var(--cream);
      flex: 1;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .table-badge {
      background: rgba(255,255,255,0.10);
      color: rgba(250,245,236,0.85);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.28rem 0.65rem;
      border-radius: 20px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .rest-meta {
      padding-top: 0.5rem;
      font-size: 0.7rem;
      color: rgba(250,245,236,0.42);
      letter-spacing: 0.04em;
    }
    .rating-badge {
      background: var(--green);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      display: inline-flex; align-items: center; gap: 0.2rem;
    }

    /* ── SEARCH ── */
    .search-wrap {
      background: var(--white);
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 1px 8px rgba(43,24,16,0.07);
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--light);
      border-radius: 10px;
      padding: 0.52rem 0.85rem;
      gap: 0.5rem;
      border: 1.5px solid transparent;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-box:focus-within { border-color: var(--orange); background: var(--white); }
    .search-box svg { flex-shrink: 0; color: #c0aa96; }
    .search-box input {
      border: none; background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.87rem; color: var(--dark); width: 100%; outline: none;
    }
    .search-box input::placeholder { color: #c0aa96; }

    /* ── VEG FILTER ── */
    .filter-bar {
      background: var(--white);
      padding: 0.48rem 1rem;
      display: flex; align-items: center; gap: 0.55rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .veg-toggle {
      display: flex; align-items: center; gap: 0.42rem;
      padding: 0.3rem 0.78rem;
      border: 1.5px solid var(--border);
      border-radius: 20px; cursor: pointer;
      font-size: 0.75rem; font-weight: 500; color: var(--gray);
      background: var(--white); white-space: nowrap;
      transition: all 0.15s; user-select: none;
    }
    .veg-toggle.active { border-color: var(--green); color: var(--green); background: #f0fff1; }
    .veg-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }

    /* ── LAYOUT ── */
    .menu-layout { display: flex; }

    /* ── CATEGORY SIDEBAR ── */
    .cat-sidebar {
      width: 88px; flex-shrink: 0;
      position: sticky; top: 48px;
      height: calc(100vh - 48px);
      overflow-y: auto; scrollbar-width: none;
      overscroll-behavior: none;
      background: var(--cream2);
      border-right: 1px solid var(--border);
    }
    .cat-sidebar::-webkit-scrollbar { display: none; }
    .sidebar-btn {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; padding: 0.85rem 0.4rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.64rem; font-weight: 500; color: var(--gray);
      background: transparent; border: none;
      border-bottom: 1px solid var(--border);
      text-align: center; cursor: pointer; line-height: 1.35;
      transition: all 0.15s; position: relative;
    }
    .sidebar-btn.active {
      background: var(--white); color: var(--orange); font-weight: 700;
    }
    .sidebar-btn.active::before {
      content: '';
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 3px; background: var(--orange); border-radius: 0 3px 3px 0;
    }
    .sidebar-top-btn {
      display: block; width: 100%; padding: 0.85rem 0;
      font-size: 1rem; font-weight: 700; color: var(--orange);
      background: transparent; border: none;
      border-top: 1px solid var(--border);
      cursor: pointer; text-align: center; transition: background 0.15s;
    }
    .sidebar-top-btn:active { background: var(--light); }

    /* ── MENU CONTENT ── */
    .menu-content { flex: 1; min-width: 0; }
    .cat-section { border-bottom: 6px solid var(--cream2); }

    .cat-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 700; color: var(--dark);
      padding: 1.25rem 1rem 0; letter-spacing: -0.01em;
    }
    .cat-subtitle {
      font-size: 0.72rem; color: var(--gray); font-weight: 400;
      padding: 0.2rem 1rem 0.75rem; letter-spacing: 0.01em;
    }

    /* ── ITEM ROW ── */
    .item-row {
      display: flex; align-items: flex-start;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem; background: var(--white);
    }
    .item-row:last-child { border-bottom: none; }
    .item-left { flex: 1; min-width: 0; }

    .veg-icon {
      width: 14px; height: 14px; border-radius: 2px;
      border: 1.5px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.3rem;
    }
    .veg-icon .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .veg-icon.nonveg { border-color: var(--red); }
    .veg-icon.nonveg .dot { background: var(--red); }

    .item-name {
      font-size: 0.91rem; font-weight: 600; color: var(--dark);
      line-height: 1.3; margin-bottom: 0.18rem;
    }
    .item-price {
      font-size: 0.9rem; font-weight: 700; color: var(--orange);
      margin-bottom: 0.28rem;
    }
    .item-desc {
      font-size: 0.73rem; color: var(--gray);
      font-weight: 400; line-height: 1.5;
    }

    /* ── ADD BUTTON ── */
    .item-right {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: center; padding-top: 0.15rem;
    }
    .add-btn {
      border: 1.5px solid var(--orange);
      background: var(--white); color: var(--orange);
      border-radius: 8px; width: 72px; height: 34px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      font-weight: 700; letter-spacing: 0.04em; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.2rem; transition: all 0.12s;
      box-shadow: 0 1px 4px rgba(196,80,31,0.12);
    }
    .add-btn:active { background: var(--orange); color: #fff; transform: scale(0.97); }

    .qty-ctrl {
      display: flex; align-items: center;
      border: 1.5px solid var(--orange); border-radius: 8px;
      overflow: hidden; width: 72px; height: 34px; background: var(--white);
    }
    .qty-btn {
      flex: 1; border: none; background: transparent; color: var(--orange);
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      height: 100%; transition: background 0.1s;
    }
    .qty-btn:active { background: var(--light); }
    .qty-num {
      font-size: 0.85rem; font-weight: 700; color: var(--orange);
      min-width: 18px; text-align: center;
    }
    .customizable { font-size: 0.6rem; color: var(--gray); margin-top: 0.3rem; text-align: center; }

    /* ── CART BAR ── */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--dark);
      padding: 0.85rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100;
      transform: translateY(110%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -6px 28px rgba(43,24,16,0.35);
    }
    .cart-bar.visible { transform: translateY(0); }
    .cart-bar-left { color: #fff; }
    .cart-item-count { font-size: 0.7rem; font-weight: 400; opacity: 0.62; margin-bottom: 0.05rem; }
    .cart-amount { font-size: 1.05rem; font-weight: 700; }
    .checkout-btn {
      background: var(--orange); color: var(--white); border: none;
      padding: 0.6rem 1.35rem; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.15s;
      box-shadow: 0 2px 10px rgba(196,80,31,0.45);
    }
    .checkout-btn:active { opacity: 0.85; }

    /* ── ORDER MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.58);
      z-index: 200; display: none; align-items: flex-end;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 22px 22px 0 0;
      padding: 0 1.25rem 2.5rem; width: 100%;
      max-height: 92vh; overflow-y: auto;
    }
    .modal-handle {
      width: 36px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0.9rem auto 1.2rem;
    }
    .modal-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
    .modal-back-btn {
      background: none; border: none; padding: 0.2rem;
      cursor: pointer; color: var(--dark); display: flex; align-items: center; flex-shrink: 0;
    }
    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; font-weight: 700; color: var(--dark);
    }
    .order-summary {
      background: var(--light); border-radius: 12px;
      padding: 0.6rem 0.9rem; margin-bottom: 1.2rem;
    }
    .sum-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.42rem 0; font-size: 0.88rem; color: var(--dark);
      border-bottom: 1px solid var(--border);
    }
    .sum-row:last-child { border-bottom: none; }
    .sum-row.total-row {
      font-weight: 700; font-size: 0.96rem; padding-top: 0.6rem; color: var(--orange);
    }
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block; font-size: 0.68rem; font-weight: 700; color: var(--gray);
      margin-bottom: 0.4rem; letter-spacing: 0.07em; text-transform: uppercase;
    }
    .form-input {
      width: 100%; padding: 0.72rem 0.9rem;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      background: var(--white); color: var(--dark); outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--orange); }
    .place-btn {
      width: 100%; padding: 1rem;
      background: var(--dark); color: var(--cream); border: none;
      border-radius: 12px; font-family: 'DM Sans', sans-serif;
      font-size: 0.96rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s; letter-spacing: 0.02em;
    }
    .place-btn:active { opacity: 0.88; }
    .place-btn:disabled { background: #ccc; cursor: not-allowed; }

    .phone-row { display: flex; align-items: center; gap: 0.5rem; }
    .phone-prefix {
      flex-shrink: 0; padding: 0.72rem 0.7rem;
      background: var(--light); border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 0.9rem; font-weight: 500; color: var(--gray);
    }
    .phone-input { flex: 1; }
    .field-error { font-size: 0.75rem; color: #e43b4f; margin-top: 0.3rem; min-height: 1rem; }

    /* ── COUPON SECTION (on menu page) ── */
    .coupon-section {
      margin: 0.5rem 0.85rem 1.2rem;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1rem 0.85rem;
    }
    .coupon-section-title {
      font-size: 0.68rem; font-weight: 700; color: var(--gray);
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 0.6rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .coupon-row {
      display: flex; gap: 0.5rem; align-items: stretch;
    }
    .coupon-input {
      flex: 1;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }
    .coupon-btn {
      flex-shrink: 0;
      padding: 0 1.1rem;
      background: var(--dark); color: var(--cream);
      border: 1.5px solid var(--dark); border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 0.84rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
    }
    .coupon-btn:active { opacity: 0.8; }
    .coupon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .coupon-feedback {
      margin-top: 0.5rem; font-size: 0.8rem;
      display: flex; align-items: center; gap: 0.35rem; min-height: 1.1rem;
    }
    .coupon-feedback.valid   { color: var(--green); font-weight: 600; }
    .coupon-feedback.invalid { color: #e43b4f; }

    /* ── HOUSE SPECIAL ── */
    .hs-star {
      color: var(--orange);
      font-size: 0.75rem;
      vertical-align: middle;
      margin-left: 2px;
    }
    .hs-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--orange);
      background: rgba(212,85,42,0.09);
      border: 1px solid rgba(212,85,42,0.22);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    /* ── SUCCESS ── */
    .success-screen {
      display: none; position: fixed; inset: 0;
      background: var(--white); z-index: 300;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }
    .success-screen.show { display: flex; }
    .success-icon {
      width: 72px; height: 72px; background: var(--orange);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.4rem;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-screen h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; font-weight: 700; color: var(--dark); margin-bottom: 0.4rem;
    }
    .success-screen p { color: var(--gray); font-size: 0.9rem; line-height: 1.65; }
    .order-num {
      background: var(--light); color: var(--dark); padding: 0.5rem 2rem;
      border-radius: 8px; font-size: 1.4rem; font-weight: 700;
      letter-spacing: 0.08em; margin: 1rem 0 1.4rem;
    }
    .new-order-btn {
      display: block; margin-top: 0.75rem; padding: 0.75rem 2rem;
      background: var(--orange); color: var(--white); border: none;
      border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }

    /* ── DESSERT 3D STAGE ── */
    .dessert-stage {
      position: relative;
      width: 100%;
      height: 230px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }
    .stage-bg {
      position: absolute;
      inset: -6px;
      background-image: url('/table-bg.jpg');
      background-size: cover;
      background-position: center 60%;
      filter: blur(5px) brightness(0.48);
      transform: scale(1.04);
    }
    .stage-bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(26,13,6,0.08) 0%, rgba(26,13,6,0.52) 100%);
    }
    /* Perspective container — CSS 3D, no WebGL needed */
    .stage-track {
      position: absolute;
      inset: 0;
      perspective: 620px;
      perspective-origin: 50% 44%;
    }
    .slab {
      position: absolute;
      top: 50%; left: 50%;
      width: 70px;
      margin-left: -35px;
      margin-top: -56px;
      border-radius: 11px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.55);
      will-change: transform, opacity;
      opacity: 1;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease, box-shadow 0.3s ease;
      z-index: 1;
    }
    /* Default rest positions — set via CSS so they show without JS */
    .slab-pos-0 { transform: translateX(-62px) translateY(12px) rotateY(-18deg) scale(0.77); z-index: 1; }
    .slab-pos-1 { transform: translateX(-32px) translateY(6px)  rotateY(-8deg)  scale(0.89); z-index: 2; }
    .slab-pos-2 { transform: translateX(0px)   translateY(0px)  rotateY(0deg)   scale(1.02); z-index: 3; }
    .slab-pos-3 { transform: translateX(32px)  translateY(6px)  rotateY(8deg)   scale(0.89); z-index: 2; }
    .slab-pos-4 { transform: translateX(62px)  translateY(12px) rotateY(18deg)  scale(0.77); z-index: 1; }
    .slab.slab-focused {
      box-shadow: 0 18px 44px rgba(212,85,42,0.65), 0 0 0 2.5px rgba(212,85,42,0.75);
      z-index: 20;
    }
    .slab img {
      width: 100%; height: 88px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .slab-label {
      font-size: 0.48rem;
      font-weight: 700;
      color: #fff;
      background: rgba(18,6,2,0.78);
      padding: 3px 5px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    .stage-hint {
      position: absolute;
      bottom: 8px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.56rem;
      color: rgba(255,255,255,0.52);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
      z-index: 5;
    }
    .stage-hint.visible { opacity: 1; }
    .dessert-row { cursor: pointer; transition: background 0.2s; }
    .dessert-row.active-row { background: #fdf0e8; border-radius: 12px; }

    /* ── EMPTY SEARCH STATE ── */
    .empty-search {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--gray);
      font-size: 0.9rem;
      display: none;
    }

    .sidebar-top-btn {
      display: block;
      width: 100%;
      padding: 0.9rem 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--orange);
      background: var(--white);
      border: none;
      border-left: 3px solid transparent;
      border-top: 1px solid var(--border);
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .sidebar-top-btn:active { background: var(--light); }

    @media (min-width: 600px) {
      .cat-sidebar { width: 110px; }
      .sidebar-btn { font-size: 0.7rem; padding: 0.9rem 0.55rem; }
      .item-name { font-size: 0.95rem; }
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 110;
      background: var(--dark);
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0.62rem 0 0.55rem;
      gap: 0.22rem;
      background: none; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
      color: rgba(250,245,236,0.38);
      transition: color 0.15s;
      position: relative;
    }
    .nav-tab.active { color: var(--orange); }
    .nav-tab svg { flex-shrink: 0; }
    .nav-tab .nav-badge {
      position: absolute; top: 6px; right: calc(50% - 20px);
      min-width: 16px; height: 16px; border-radius: 8px;
      background: var(--orange); color: #fff;
      font-size: 9px; font-weight: 800; padding: 0 4px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Cart bar sits above the nav */
    .cart-bar { bottom: 56px; }

    /* ── ORDERS PANEL ── */
    .orders-panel {
      display: none;
      flex-direction: column;
      position: fixed;
      inset: 0;
      bottom: 56px;
      background: var(--cream2);
      z-index: 50;
      overflow-y: auto;
    }
    .orders-panel.show { display: flex; }

    .orders-header {
      position: sticky; top: 0; z-index: 10;
      background: var(--dark);
      padding: 1rem 1rem 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .orders-header-top {
      display: flex; align-items: center; justify-content: space-between;
    }
    .orders-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; font-weight: 700; font-style: italic;
      color: var(--cream);
    }
    .orders-table-chip {
      background: rgba(196,80,31,0.2);
      border: 1px solid rgba(196,80,31,0.4);
      color: var(--orange-l);
      font-size: 0.7rem; font-weight: 600;
      padding: 0.22rem 0.65rem; border-radius: 20px;
      letter-spacing: 0.05em;
    }

    .orders-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.75rem; padding: 3rem 2rem; text-align: center;
      color: var(--gray);
    }
    .orders-empty svg { opacity: 0.35; }
    .orders-empty p { font-size: 0.9rem; }
    .orders-empty small { font-size: 0.75rem; opacity: 0.65; }

    .orders-list { padding: 0.75rem 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.85rem; }

    .order-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(43,24,16,0.10);
      animation: cardIn 0.3s ease;
    }
    @keyframes cardIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    .order-card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 0.9rem 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    .order-card-id {
      font-weight: 700; font-size: 0.95rem; color: var(--dark);
    }
    .order-card-time {
      font-size: 0.72rem; color: var(--gray); margin-top: 1px;
    }
    .order-status-pill {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.25rem 0.7rem; border-radius: 20px;
    }
    .pill-pending   { background: rgba(196,80,31,0.12); color: var(--orange); border:1px solid rgba(196,80,31,0.25); }
    .pill-preparing { background: rgba(234,179,8,0.12);  color: #ca8a04;       border:1px solid rgba(234,179,8,0.25); }
    .pill-done      { background: rgba(34,197,94,0.12);  color: #16a34a;       border:1px solid rgba(34,197,94,0.25); }
    .pill-settled   { background: rgba(99,102,241,0.10); color: #6366f1;       border:1px solid rgba(99,102,241,0.22); }
    .pill-cancelled { background: rgba(239,68,68,0.10);  color: #dc2626;       border:1px solid rgba(239,68,68,0.22); }

    /* Mini stepper */
    .order-stepper {
      display: flex; align-items: center; padding: 0.6rem 0.9rem 0.55rem;
      gap: 0; border-bottom: 1px solid var(--border);
    }
    .ost-dot {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem;
      border: 2px solid var(--border);
      background: var(--light);
      color: var(--gray);
      font-weight: 700;
    }
    .ost-dot.active { border-color: var(--orange); background: rgba(196,80,31,0.12); color: var(--orange); }
    .ost-dot.done   { border-color: #16a34a; background: rgba(22,163,74,0.1); color: #16a34a; }
    .ost-line { flex: 1; height: 2px; background: var(--border); position: relative; overflow: hidden; border-radius: 1px; }
    .ost-line-fill { position: absolute; inset: 0; background: var(--orange); width: 0%; transition: width 0.6s ease; border-radius: 1px; }
    .ost-line-fill.done-fill { background: #16a34a; width: 100%; }
    .ost-label-row {
      display: flex; justify-content: space-between;
      padding: 0.15rem 0.9rem 0.5rem;
      font-size: 0.6rem; color: var(--gray); letter-spacing: 0.04em;
    }

    .order-items-body { padding: 0.6rem 0.9rem; }
    .oi-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.28rem 0; font-size: 0.82rem;
      border-bottom: 1px solid var(--border); color: var(--dark);
    }
    .oi-row:last-child { border-bottom: none; }
    .oi-qty { color: var(--orange); font-weight: 700; margin-right: 0.35rem; font-size: 0.78rem; }
    .oi-total-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.9rem 0.7rem;
      font-size: 0.85rem; font-weight: 700; color: var(--orange);
      border-top: 1px solid var(--border);
    }

    .orders-loading {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 2.5rem; color: var(--gray); font-size: 0.88rem;
    }
  </style>
</head>
<body>

<!-- RESTAURANT HEADER -->
<div class="rest-header">
  <div class="rest-top">
    <div class="rest-logo"><img src="/logo.jpg" alt="La Siesta"></div>
    <div class="rest-name">La Siesta</div>
    <div class="table-badge" id="tableBadge">Table —</div>
  </div>
  <div class="rest-meta">
    <span>Garden Café · Nagpur</span>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search in menu" oninput="filterMenu()">
  </div>
</div>

<!-- VEG FILTER -->
<div class="filter-bar">
  <div class="veg-toggle" id="vegToggle" onclick="toggleVeg()">
    <div class="veg-dot"></div>
    Veg Only
  </div>
  <div class="veg-toggle" id="nonvegToggle" onclick="toggleNonVeg()" style="--dot-color:#e43b4f">
    <div class="veg-dot" style="background:var(--red)"></div>
    Non Veg
  </div>
</div>

<!-- LAYOUT -->
<div class="menu-layout">

  <!-- CATEGORY SIDEBAR -->
  <nav class="cat-sidebar" id="catSidebar"></nav>

  <!-- MENU CONTENT -->
  <div class="menu-content" id="menuContent">
    <div class="empty-search" id="emptySearch">No items found</div>
  </div>

</div>

<!-- COUPON VERIFY SECTION -->
<div class="coupon-section" id="couponSection">
  <div class="coupon-section-title">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    Have a coupon?
  </div>
  <div class="coupon-row">
    <input class="form-input coupon-input" id="couponInput" type="text"
           placeholder="Enter code" oninput="onCouponInput()"
           autocomplete="off" spellcheck="false">
    <button class="coupon-btn" id="couponBtn" onclick="applyCoupon()" disabled>Verify</button>
    <button class="coupon-btn" id="redeemBtn" onclick="redeemCoupon()"
            style="display:none; background:#16a34a; border-color:#16a34a;">Redeem</button>
  </div>
  <div class="coupon-feedback" id="couponFeedback"></div>
</div>

<!-- CART BAR -->
<div class="cart-bar" id="cartBar">
  <div class="cart-bar-left">
    <div class="cart-item-count" id="cartCountLbl">0 items</div>
    <div class="cart-amount" id="cartTotalLbl">₹0</div>
  </div>
  <button class="checkout-btn" onclick="openCheckout()">View Cart →</button>
</div>

<!-- ORDER MODAL -->
<div class="modal-backdrop" id="orderModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <button class="modal-back-btn" onclick="document.getElementById('orderModal').classList.remove('open')" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="modal-title">Your Order</div>
    </div>
    <div class="order-summary" id="orderSummary"></div>

    <div class="form-group">
      <label class="form-label">Your Name</label>
      <input class="form-input" id="custName" type="text" placeholder="Name to call out" oninput="updatePlaceBtn()">
    </div>

    <div class="form-group">
      <label class="form-label">Mobile Number</label>
      <div class="phone-row">
        <div class="phone-prefix">+91</div>
        <input class="form-input phone-input" id="custPhone" type="tel" maxlength="10" placeholder="10-digit number" oninput="onPhoneInput()">
      </div>
      <div id="phoneError" class="field-error"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Special Requests</label>
      <input class="form-input" id="orderNotes" type="text" placeholder="No sugar, extra ice, oat milk…">
    </div>

    <button class="place-btn" id="placeBtn" onclick="placeOrder()" disabled>Place Order</button>
  </div>
</div>

<!-- ORDERS PANEL -->
<div class="orders-panel" id="ordersPanel">
  <div class="orders-header">
    <div class="orders-header-top">
      <div class="orders-title">My Orders</div>
      <div class="orders-table-chip" id="ordersTableChip">Table —</div>
    </div>
  </div>
  <div class="orders-loading" id="ordersLoading" style="display:none">
    <span class="loading-dots"><span></span><span></span><span></span></span>
    Loading orders…
  </div>
  <div id="ordersBody"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-tab active" id="navMenu" onclick="switchTab('menu')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    Menu
  </button>
  <button class="nav-tab" id="navOrders" onclick="switchTab('orders')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
      <rect x="9" y="3" width="6" height="4" rx="1"/>
      <path d="M9 12h6M9 16h4"/>
    </svg>
    My Orders
    <span class="nav-badge" id="ordersBadge" style="display:none"></span>
  </button>
</nav>

<!-- SUCCESS -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h2>Order Placed!</h2>
  <div class="order-num" id="successNum">#0001</div>
  <p id="successWait">Sit back &amp; relax — we'll have it ready shortly ☕</p>
  <a id="trackOrderBtn" href="/status?order=1"
     style="display:inline-block;margin:1rem 0 0;padding:0.55rem 1.5rem;background:var(--light);color:var(--dark);border-radius:8px;font-size:0.82rem;font-weight:600;text-decoration:none;border:1.5px solid rgba(0,0,0,0.08)">
    📍 Track Order Status
  </a>
  <button class="new-order-btn" onclick="resetOrder()">Order More</button>
</div>

<script>
  let menu = [];
  let cart = {};
  let tableNumber = 1;
  let vegOnly = false;
  let nonVegOnly = false;

  const NON_VEG_KEYWORDS = ['chicken', 'egg', 'mutton', 'prawn', 'fish', 'beef', 'pork', 'keema', 'bonafide'];

  const DESSERT_IMAGES = {
    'Mango Tres Leches':     '/ds1.png',
    'Mango Misu':            '/ds2.png',
    'Tiramisu':              '/ds3.png',
    'Chocolate Croissant':   '/ds4.png',
    'Belgian Chocolate Cake':'/ds5.png',
  };

  const MATCHA_IMAGES = {
    'Mango Matcha Latte':      '/mt1.jpg',
    'Matcha Latte':            '/mt2.jpg',
    'Matcha Cloud':            '/mt3.jpg',
    'Strawberry Matcha Latte': '/mt4.jpg',
  };

  function isNonVeg(name, desc = '') {
    const text = (name + ' ' + desc).toLowerCase();
    return NON_VEG_KEYWORDS.some(k => text.includes(k));
  }

  // ── DESSERT 3D STAGE (Three.js) ───────────────────────────────────────────
  let stageEntered  = false;
  let focusedIds    = [];
  let _threeInited  = false;

  function renderDessertStage(items) {
    window._dessertItems = items;
    _threeInited = false;
    if (window._threeCleanup) window._threeCleanup();
    const slabs = items.slice(0,5).map((item, i) => {
      const src = DESSERT_IMAGES[item.name] || `/ds${i+1}.png`;
      const label = item.name.split(' ').slice(0,2).join(' ');
      return `<div class="slab slab-pos-${i}" data-id="${item.id}" onclick="focusDessert(${item.id})">
        <img src="${src}" alt="${item.name}">
        <div class="slab-label">${label}</div>
      </div>`;
    }).join('');
    return `
      <div class="dessert-stage" id="dessertStage">
        <div class="stage-bg"></div>
        <div class="stage-bg-overlay"></div>
        <div class="stage-track" id="stageTrack">${slabs}</div>
        <div class="stage-hint" id="stageHint">tap a dessert</div>
      </div>`;
  }

  function triggerStageEntrance() {
    if (stageEntered) return;
    stageEntered = true;
    focusedIds = [];
    if (window._threeEntrance) window._threeEntrance();
  }

  function focusDessert(itemId) {
    const wasFocused = focusedIds.includes(itemId);
    if (wasFocused) focusedIds = focusedIds.filter(id => id !== itemId);
    else            focusedIds.push(itemId);

    if (window._threeFocus) window._threeFocus(itemId);

    const row = document.getElementById(`card-${itemId}`);
    if (row) row.classList.toggle('active-row', !wasFocused);

    const hint = document.getElementById('stageHint');
    if (hint) hint.classList.remove('visible');
  }

  function triggerStageExit(callback) {
    if (window._threeExit) window._threeExit(callback);
    else callback && callback();
  }

  function _resetStageCards() {
    focusedIds = [];
    if (window._threeReset) window._threeReset();
  }

  // Called by IntersectionObserver AND by module script (race-condition guard)
  function _initStageWhenReady(tries) {
    const track = document.getElementById('stageTrack');
    if (!track) return;
    if (window._threeInit) {
      if (!_threeInited) {
        window._threeInit(track, window._dessertItems || []);
        _threeInited = true;
      }
      if (!stageEntered) triggerStageEntrance();
    } else if (tries < 20) {
      setTimeout(() => _initStageWhenReady(tries + 1), 80);
    }
  }
  window._initStageWhenReady = () => _initStageWhenReady(0);

  function watchDessertStage() {
    const stage = document.getElementById('dessertStage');
    if (!stage) return;
    stageEntered = false;
    const obs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        _initStageWhenReady(0);
        obs.disconnect();
      }
    }, { threshold: 0.15 });
    obs.observe(stage);
  }

  const params = new URLSearchParams(window.location.search);
  tableNumber = parseInt(params.get('table')) || 1;
  document.getElementById('tableBadge').textContent = `Table ${tableNumber}`;

  fetch('/api/menu').then(r => r.json()).then(data => {
    menu = data;
    renderSidebar();
    renderMenu();
    setupScrollSpy();
  });

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('catSidebar').scrollTo({ top: 0, behavior: 'smooth' });
    const firstBtn = document.querySelector('.sidebar-btn');
    if (firstBtn) {
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      firstBtn.classList.add('active');
    }
  }

  function renderSidebar() {
    document.getElementById('catSidebar').innerHTML = menu.map((cat, i) =>
      `<button class="sidebar-btn${i===0?' active':''}" id="side-${cat.id}" data-cat="${cat.id}" onclick="scrollToCat(${cat.id},this)">${cat.name}</button>`
    ).join('') + `<button class="sidebar-top-btn" onclick="scrollToTop()" title="Back to top">↑</button>`;
  }

  function toggleVeg() {
    vegOnly = !vegOnly;
    if (vegOnly) nonVegOnly = false;
    document.getElementById('vegToggle').classList.toggle('active', vegOnly);
    document.getElementById('nonvegToggle').classList.toggle('active', nonVegOnly);
    renderMenu();
  }

  function toggleNonVeg() {
    nonVegOnly = !nonVegOnly;
    if (nonVegOnly) vegOnly = false;
    document.getElementById('nonvegToggle').classList.toggle('active', nonVegOnly);
    document.getElementById('vegToggle').classList.toggle('active', vegOnly);
    renderMenu();
  }

  function filterMenu() {
    renderMenu();
  }

  function renderMenu() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    let html = '';
    let anyVisible = false;

    for (const cat of menu) {
      // hide drink categories when veg/non-veg filter is active
      if ((vegOnly || nonVegOnly) && !FOOD_CATS.includes(cat.name)) continue;

      const items = cat.items.filter(item => {
        if (vegOnly && isNonVeg(item.name, item.description)) return false;
        if (nonVegOnly && !isNonVeg(item.name, item.description)) return false;
        if (query && !item.name.toLowerCase().includes(query) && !(item.description||'').toLowerCase().includes(query)) return false;
        return true;
      });
      if (items.length === 0) continue;
      anyVisible = true;
      html += `
        <div class="cat-section" id="cat-${cat.id}" data-cat="${cat.id}">
          <div class="cat-title">${cat.name}</div>
          <div class="cat-subtitle">${items.length} item${items.length!==1?'s':''}</div>
          ${items.map(item => renderItemRow(item, cat.name, false)).join('')}
        </div>`;
    }

    document.getElementById('menuContent').innerHTML = html + `<div class="empty-search" id="emptySearch" style="display:${anyVisible?'none':'block'}">No items found</div>`;
    if (query || vegOnly) return; // don't re-setup scroll spy on filter
    setupScrollSpy();
  }

  const FOOD_CATS = ['Global Fusions', 'Toasties', 'Pasta', 'Sandwiches', 'Mains', 'Special Rice Bowls', 'Sides', 'Sweet', 'Desserts'];

  function renderItemRow(item, catName = '', isDesserts = false) {
    const qty = cart[item.id]?.qty || 0;
    const unavailable = item.is_available === false;
    const nv = isNonVeg(item.name, item.description);
    const vegHtml = FOOD_CATS.includes(catName)
      ? `<div class="veg-icon${nv?' nonveg':''}"><div class="dot"></div></div>`
      : '';
    const ctrl = unavailable
      ? `<span style="font-size:11px;font-weight:600;color:#b07070;background:rgba(180,60,60,0.12);padding:5px 10px;border-radius:20px;white-space:nowrap;">Not Available</span>`
      : qty === 0
        ? `<button class="add-btn" onclick="addItem(${item.id})"><span>+</span> ADD</button>`
        : `<div class="qty-ctrl">
             <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
             <span class="qty-num">${qty}</span>
             <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
           </div>`;
    // Inline photos for Matcha and Desserts
    const itemImg = MATCHA_IMAGES[item.name] || DESSERT_IMAGES[item.name];
    const inlineImg = itemImg
      ? `<img src="${itemImg}" alt="${item.name}" style="width:100%;border-radius:10px;margin:0.6rem 0 0.2rem;object-fit:cover;max-height:160px;display:block;${unavailable?'opacity:0.4;filter:grayscale(1);':''}">`
      : '';
    const hsBadge = item.is_house_special
      ? `<span class="hs-badge">✦ House Special</span>`
      : '';
    return `
      <div class="item-row${isDesserts ? ' dessert-row' : ''}" id="card-${item.id}" style="${unavailable?'opacity:0.55;':''}">
        <div class="item-left">
          ${vegHtml}
          <div class="item-name" style="${unavailable?'color:#8a7070;':''}">${item.name}${item.is_house_special ? ' <span class="hs-star">✦</span>' : ''}</div>
          <div class="item-price">₹${item.price}${hsBadge}</div>
          ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
          ${inlineImg}
        </div>
        <div class="item-right" id="ctrl-${item.id}">${ctrl}</div>
      </div>`;
  }

  function getItemById(id) {
    for (const cat of menu) {
      const item = cat.items.find(i => i.id === id);
      if (item) return item;
    }
  }

  function addItem(id) {
    const item = getItemById(id);
    if (item.is_available === false) return;
    cart[id] = { id, name: item.name, price: item.price, qty: (cart[id]?.qty || 0) + 1 };
    refreshCtrl(id);
    updateCartBar();
  }

  function changeQty(id, delta) {
    const qty = (cart[id]?.qty || 0) + delta;
    if (qty <= 0) { delete cart[id]; }
    else {
      const item = getItemById(id);
      cart[id] = { id, name: item.name, price: item.price, qty };
    }
    refreshCtrl(id);
    updateCartBar();
  }

  function refreshCtrl(id) {
    const qty = cart[id]?.qty || 0;
    const el = document.getElementById(`ctrl-${id}`);
    if (!el) return;
    el.innerHTML = qty === 0
      ? `<button class="add-btn" onclick="addItem(${id})"><span>+</span> ADD</button>`
      : `<div class="qty-ctrl">
           <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
           <span class="qty-num">${qty}</span>
           <button class="qty-btn" onclick="changeQty(${id},1)">+</button>
         </div>`;
  }

  function updateCartBar() {
    const items = Object.values(cart);
    const count = items.reduce((s,i) => s + i.qty, 0);
    const total = items.reduce((s,i) => s + i.price * i.qty, 0);
    document.getElementById('cartCountLbl').textContent = `${count} item${count!==1?'s':''}`;
    document.getElementById('cartTotalLbl').textContent = `₹${total}`;
    document.getElementById('cartBar').classList.toggle('visible', count > 0);
  }

  function scrollToCat(id, btn) {
    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const el = document.getElementById(`cat-${id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // re-trigger dessert stage entrance if scrolling to Desserts
    const stage = document.getElementById('dessertStage');
    if (stage && el && el.contains(stage)) {
      stageEntered = false;
      _resetStageCards();
      setTimeout(triggerStageEntrance, 350);
    }
  }

  function setupScrollSpy() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const id = e.target.dataset.cat;
          document.querySelectorAll('.sidebar-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.cat === id);
          });
          document.getElementById(`side-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }, { rootMargin: '-100px 0px -55% 0px', threshold: 0 });

    setTimeout(() => {
      document.querySelectorAll('.cat-section').forEach(s => obs.observe(s));
    }, 400);
  }


  function onPhoneInput() {
    const phone = document.getElementById('custPhone').value;
    document.getElementById('phoneError').textContent = '';
    updatePlaceBtn();
  }

  function updatePlaceBtn() {
    const name  = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    // Phone is optional — only validate format if something was entered
    const phoneOk = !phone || /^[6-9]\d{9}$/.test(phone);
    if (phone && !phoneOk) {
      document.getElementById('phoneError').textContent = 'Enter a valid 10-digit number';
    } else {
      document.getElementById('phoneError').textContent = '';
    }
    document.getElementById('placeBtn').disabled = !(name && phoneOk);
  }

  function openCheckout() {
    const open = () => {
      updateOrderSummary();
      document.getElementById('orderModal').classList.add('open');
    };
    const stage = document.getElementById('dessertStage');
    if (stage) triggerStageExit(open);
    else open();
  }

  document.getElementById('orderModal').addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('open');
      resetCoupon();
      stageEntered = false;
      _resetStageCards();
      setTimeout(triggerStageEntrance, 200);
    }
  });

  async function placeOrder() {
    const btn = document.getElementById('placeBtn');
    btn.disabled = true; btn.textContent = 'Placing…';
    try {
      const res = await fetch('/api/orders', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          table_number: tableNumber,
          customer_name: document.getElementById('custName').value.trim(),
          customer_phone: document.getElementById('custPhone').value.trim(),
          notes: document.getElementById('orderNotes').value.trim(),
          items: Object.values(cart).map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.qty }))
        })
      });
      const data = await res.json();
      if (data.success || data.order_id || data.order) {
        const orderId = data.order_id || data.order?.id;
        document.getElementById('orderModal').classList.remove('open');
        const orderIdStr = String(orderId).padStart(4,'0');
        document.getElementById('successNum').textContent = `#${orderIdStr}`;
        const wait = data.wait_minutes || 10;
        document.getElementById('successWait').textContent =
          `Ready in about ${wait}–${wait + 5} min. Sit back & relax ☕`;
        document.getElementById('trackOrderBtn').href = `/status?order=${orderId}`;
        document.getElementById('successScreen').classList.add('show');
        cart = {};
        updateCartBar();
        resetCoupon();
        ordersLoaded = false; // refresh orders tab next time it's opened
      } else {
        const msg = data.error || 'Something went wrong. Please try again.';
        alert(msg);
        btn.disabled = false; btn.textContent = 'Place Order';
      }
    } catch(err) {
      alert('Connection error. Please try again.');
      btn.disabled = false; btn.textContent = 'Place Order';
    }
  }

  function resetOrder() {
    document.getElementById('successScreen').classList.remove('show');
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('orderNotes').value = '';
    document.getElementById('phoneError').textContent = '';
    document.getElementById('placeBtn').disabled = true;
    resetCoupon();
  }

  // ── COUPON VERIFY + REDEEM ────────────────────────────────────────────────
  function onCouponInput() {
    const val = document.getElementById('couponInput').value.trim();
    document.getElementById('couponBtn').disabled = val.length < 2;
    document.getElementById('couponFeedback').className = 'coupon-feedback';
    document.getElementById('couponFeedback').innerHTML = '';
    document.getElementById('couponBtn').textContent = 'Verify';
    // Hide redeem button whenever input changes
    const rb = document.getElementById('redeemBtn');
    if (rb) rb.style.display = 'none';
  }

  async function applyCoupon() {
    const code = document.getElementById('couponInput').value.trim();
    if (!code) return;
    const fb  = document.getElementById('couponFeedback');
    const btn = document.getElementById('couponBtn');
    btn.disabled = true; btn.textContent = '…';
    fb.className = 'coupon-feedback'; fb.innerHTML = 'Checking…';
    const rb = document.getElementById('redeemBtn');
    if (rb) rb.style.display = 'none';
    try {
      const res  = await fetch(`/api/coupons/verify?code=${encodeURIComponent(code)}`);
      const data = await res.json();
      if (data.valid) {
        const remark = data.discount_type === 'percent'
          ? `${data.discount_value}% flat off`
          : `₹${data.discount_value} flat off`;
        fb.className = 'coupon-feedback valid';
        fb.innerHTML = `<span>✓</span> ${remark}`;
        btn.textContent = '✓ Valid';
        // Show Redeem button
        if (rb) { rb.style.display = 'inline-flex'; rb.disabled = false; rb.textContent = 'Redeem'; }
      } else {
        fb.className = 'coupon-feedback invalid';
        fb.innerHTML = `<span>✕</span> ${data.error}`;
        btn.disabled = false; btn.textContent = 'Verify';
      }
    } catch {
      fb.className = 'coupon-feedback invalid';
      fb.innerHTML = '<span>✕</span> Could not verify. Try again.';
      btn.disabled = false; btn.textContent = 'Verify';
    }
  }

  async function redeemCoupon() {
    const code = document.getElementById('couponInput').value.trim();
    if (!code) return;
    const fb  = document.getElementById('couponFeedback');
    const rb  = document.getElementById('redeemBtn');
    rb.disabled = true; rb.textContent = '…';
    try {
      const res  = await fetch('/api/coupons/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (data.success) {
        fb.className = 'coupon-feedback valid';
        fb.innerHTML = `<span>✓</span> Coupon redeemed! Show this to your waiter.`;
        rb.style.display = 'none';
        document.getElementById('couponBtn').style.display = 'none';
        document.getElementById('couponInput').disabled = true;
      } else {
        fb.className = 'coupon-feedback invalid';
        fb.innerHTML = `<span>✕</span> ${data.error}`;
        rb.disabled = false; rb.textContent = 'Redeem';
      }
    } catch {
      fb.className = 'coupon-feedback invalid';
      fb.innerHTML = '<span>✕</span> Could not redeem. Try again.';
      rb.disabled = false; rb.textContent = 'Redeem';
    }
  }

  function updateOrderSummary() {
    const items    = Object.values(cart);
    const subtotal = items.reduce((s,i) => s + i.price * i.qty, 0);
    const html = items.map(i =>
      `<div class="sum-row"><span>${i.qty}× ${i.name}</span><span>₹${i.price * i.qty}</span></div>`
    ).join('') + `<div class="sum-row total-row"><span>Total</span><span>₹${subtotal}</span></div>`;
    const el = document.getElementById('orderSummary');
    if (el) el.innerHTML = html;
  }

  function resetCoupon() {
    const inp = document.getElementById('couponInput');
    const fb  = document.getElementById('couponFeedback');
    const btn = document.getElementById('couponBtn');
    const rb  = document.getElementById('redeemBtn');
    if (inp) { inp.value = ''; inp.disabled = false; }
    if (fb)  { fb.className = 'coupon-feedback'; fb.innerHTML = ''; }
    if (btn) { btn.disabled = true; btn.textContent = 'Verify'; btn.style.display = ''; }
    if (rb)  { rb.style.display = 'none'; rb.disabled = false; rb.textContent = 'Redeem'; }
  }

  // ── ORDERS TAB ────────────────────────────────────────────────────────────
  let tableOrders = [];
  let ordersLoaded = false;
  let currentTab = 'menu';

  document.getElementById('ordersTableChip').textContent = 'Table ' + tableNumber;

  function switchTab(tab) {
    currentTab = tab;
    const menuBtn    = document.getElementById('navMenu');
    const ordersBtn  = document.getElementById('navOrders');
    const panel      = document.getElementById('ordersPanel');
    const menuLayout = document.querySelector('.menu-layout');
    const searchWrap = document.querySelector('.search-wrap');
    const filterBar  = document.querySelector('.filter-bar');

    if (tab === 'orders') {
      menuBtn.classList.remove('active');
      ordersBtn.classList.add('active');
      panel.classList.add('show');
      searchWrap.style.display = 'none';
      filterBar.style.display  = 'none';
      menuLayout.style.display = 'none';
      document.getElementById('couponSection').style.display = 'none';
      // hide cart bar while on orders tab
      document.getElementById('cartBar').classList.remove('visible');
      document.getElementById('ordersBadge').style.display = 'none';
      if (!ordersLoaded) loadTableOrders();
    } else {
      ordersBtn.classList.remove('active');
      menuBtn.classList.add('active');
      panel.classList.remove('show');
      searchWrap.style.display = '';
      filterBar.style.display  = '';
      menuLayout.style.display = '';
      document.getElementById('couponSection').style.display = '';
      // restore cart bar if items in cart
      updateCartBar();
    }
  }

  async function loadTableOrders() {
    const loading = document.getElementById('ordersLoading');
    const body    = document.getElementById('ordersBody');
    loading.style.display = 'flex';
    body.innerHTML = '';
    try {
      const res = await fetch('/api/orders?table=' + tableNumber);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      tableOrders = Array.isArray(data) ? data : [];
      ordersLoaded = true;
      loading.style.display = 'none';
      renderTableOrders();
    } catch(e) {
      loading.style.display = 'none';
      body.innerHTML =
        '<div class="orders-empty"><p>Could not load orders.</p><small>Check your connection and try again.</small></div>';
    }
  }

  function timeAgo(dateStr) {
    const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
    return Math.floor(diff / 3600) + 'h ago';
  }

  function pillClass(status) {
    return { pending: 'pill-pending', preparing: 'pill-preparing', done: 'pill-done',
             settled: 'pill-settled', cancelled: 'pill-cancelled' }[status] || 'pill-pending';
  }
  function pillLabel(status) {
    return { pending: 'Received', preparing: 'Preparing', done: 'Ready!',
             settled: 'Settled', cancelled: 'Cancelled' }[status] || status;
  }

  function stepperHTML(status) {
    const step = { pending: 0, preparing: 1, done: 2, settled: 2 }[status] ?? 0;
    const dot = (i) => {
      const cls = i < step ? 'done' : i === step ? 'active' : '';
      const icon = i < step ? '✓' : (i === 0 ? '📋' : i === 1 ? '🍳' : '✅');
      return `<div class="ost-dot ${cls}">${icon}</div>`;
    };
    const line = (i) => {
      const fill = step > i ? 'done-fill' : (step === i + 1 ? 'done-fill' : '');
      const w    = step > i ? '100%' : '0%';
      return `<div class="ost-line"><div class="ost-line-fill ${fill}" style="width:${w}"></div></div>`;
    };
    if (['settled','cancelled'].includes(status)) return '';
    return `
      <div class="order-stepper">${dot(0)}${line(0)}${dot(1)}${line(1)}${dot(2)}</div>
      <div class="ost-label-row"><span>Received</span><span>Preparing</span><span>Ready</span></div>`;
  }

  function renderOrderCard(order) {
    const itemsHTML = (order.items || []).map(i =>
      `<div class="oi-row">
        <span><span class="oi-qty">${i.quantity}×</span>${i.item_name}</span>
        <span>₹${i.item_price * i.quantity}</span>
      </div>`
    ).join('');

    return `
      <div class="order-card" id="oc-${order.id}">
        <div class="order-card-head">
          <div>
            <div class="order-card-id">Order #${String(order.id).padStart(4,'0')}</div>
            <div class="order-card-time">${timeAgo(order.created_at)}</div>
          </div>
          <div class="order-status-pill ${pillClass(order.status)}">${pillLabel(order.status)}</div>
        </div>
        ${stepperHTML(order.status)}
        <div class="order-items-body">${itemsHTML}</div>
        <div class="oi-total-row"><span>Total</span><span>₹${Number(order.total||0).toFixed(0)}</span></div>
      </div>`;
  }

  function renderTableOrders() {
    const active = tableOrders.filter(o => !['settled','cancelled'].includes(o.status));
    if (tableOrders.length === 0) {
      document.getElementById('ordersBody').innerHTML = `
        <div class="orders-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>
          </svg>
          <p>No orders yet</p>
          <small>Your orders for Table ${tableNumber} will appear here.</small>
        </div>`;
      return;
    }
    document.getElementById('ordersBody').innerHTML =
      '<div class="orders-list">' + tableOrders.map(renderOrderCard).join('') + '</div>';
  }

  function updateOrderCard(order) {
    if (Number(order.table_number) !== Number(tableNumber)) return;
    // update or prepend in array
    const idx = tableOrders.findIndex(o => o.id === order.id);
    if (idx >= 0) tableOrders[idx] = order;
    else { tableOrders.unshift(order); }

    if (currentTab === 'orders') {
      renderTableOrders();
    } else {
      // show badge on Orders tab
      const active = tableOrders.filter(o => !['settled','cancelled'].includes(o.status)).length;
      const badge = document.getElementById('ordersBadge');
      if (active > 0) { badge.style.display = 'flex'; badge.textContent = active; }
      else badge.style.display = 'none';
    }
  }

  // Hook into socket for this table's order updates
  (function hookOrdersSocket() {
    // Load socket.io dynamically if not already loaded
    function attachSocket() {
      if (typeof io !== 'undefined') {
        const s = io();
        s.on('new_order', o => { if (Number(o.table_number) === tableNumber) updateOrderCard(o); });
        s.on('order_updated', o => { if (Number(o.table_number) === tableNumber) updateOrderCard(o); });
        return;
      }
      // socket.io not loaded — load it
      const sc = document.createElement('script');
      sc.src = '/socket.io/socket.io.js';
      sc.onload = () => {
        const s = io();
        s.on('new_order', o => { if (Number(o.table_number) === tableNumber) updateOrderCard(o); });
        s.on('order_updated', o => { if (Number(o.table_number) === tableNumber) updateOrderCard(o); });
      };
      document.body.appendChild(sc);
    }
    attachSocket();
  })();

</script>

<!-- ── DESSERT STAGE ENGINE — pure CSS 3D + rAF, zero CDN deps ── -->
<script>
(function() {

  // REST positions mirror the CSS .slab-pos-* classes
  var REST = [
    { x: -62, y: 12, ry: -18, s: 0.77 },
    { x: -32, y:  6, ry:  -8, s: 0.89 },
    { x:   0, y:  0, ry:   0, s: 1.02 },
    { x:  32, y:  6, ry:   8, s: 0.89 },
    { x:  62, y: 12, ry:  18, s: 0.77 },
  ];

  var _slabs = [];

  window._threeCleanup = function() { _slabs = []; };

  // Slabs are already visible via CSS .slab-pos-* — just register them for focus interactions
  window._threeInit = function(trackEl, items) {
    window._threeCleanup();
    _slabs = items.slice(0, 5).map(function(item, i) {
      var el = trackEl.querySelector('.slab[data-id="' + item.id + '"]');
      if (!el) return null;
      return { el: el, id: item.id, rest: REST[i] || REST[2], focused: false };
    }).filter(Boolean);
  };

  // Slabs already visible; just reveal the hint text
  window._threeEntrance = function() {
    setTimeout(function() {
      var h = document.getElementById('stageHint');
      if (h) h.classList.add('visible');
    }, 700);
  };

  window._threeFocus = function(itemId) {
    var focused = null;
    _slabs.forEach(function(s) { if (s.id === itemId) focused = s; });
    if (!focused) return;
    focused.focused = !focused.focused;
    focused.el.classList.toggle('slab-focused', focused.focused);
    var any = _slabs.some(function(s) { return s.focused; });
    _slabs.forEach(function(s) {
      if (s.focused) {
        var r = s.rest;
        s.el.style.transform = 'translateX('+r.x+'px) translateY('+(r.y-28)+'px) rotateY(0deg) scale('+(r.s*1.30)+')';
        s.el.style.opacity = '1';
      } else if (any) {
        var r = s.rest;
        s.el.style.transform = 'translateX('+r.x+'px) translateY('+(r.y+12)+'px) rotateY('+r.ry+'deg) scale('+(r.s*0.82)+')';
        s.el.style.opacity = '0.32';
      } else {
        // Clear inline styles — CSS .slab-pos-* class takes over
        s.el.style.transform = '';
        s.el.style.opacity = '';
      }
    });
  };

  window._threeExit = function(cb) {
    _slabs.forEach(function(s) { s.el.style.opacity = '0'; });
    setTimeout(function() { if (cb) cb(); }, 350);
  };

  window._threeReset = function() {
    _slabs.forEach(function(s) {
      s.focused = false;
      s.el.classList.remove('slab-focused');
      s.el.style.transform = '';
      s.el.style.opacity = '';
    });
  };

  window._initStageWhenReady && window._initStageWhenReady();
  console.log('[dessert] CSS engine ready ✓');
})();
</script>
